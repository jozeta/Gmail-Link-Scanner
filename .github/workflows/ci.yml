name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Lint (ESLint, including the unsafe-DOM rule)
        run: npm run lint
      - name: Unit tests (background logic, heuristics, domain lists)
        # Node 22 needs files or a glob here, not a folder.
        run: node --test "tests/*.test.js"
      - name: Content-script tests (headless Chrome)
        run: BROWSER="$(command -v google-chrome || command -v chromium)" node tests/run-content-tests.js
